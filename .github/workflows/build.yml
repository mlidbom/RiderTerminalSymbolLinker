name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # No localIdePath -> the build downloads the pinned stable Rider (gradle.properties), which both plugins build against.
      # Each task runs in both projects, the symbol linker and ClaudeSessions.
      # `test` runs the unit tests (FileReferences / SolutionFileIndex); buildPlugin does not depend on it.
      # Every deprecation Gradle finds is printed, not just counted: this path downloads a Rider, which a local build
      # doesn't, so some are seen only here.
      - name: Build plugin
        run: ./gradlew test buildPlugin --console=plain --stacktrace --warning-mode all

      # The Marketplace's own check, failing on any finding (build.gradle.kts says why), against the pinned Rider
      # and the latest release.
      - name: Verify plugin
        run: ./gradlew verifyPlugin --console=plain --stacktrace

      - name: Upload plugin zip
        uses: actions/upload-artifact@v7
        with:
          name: RiderTerminalSymbolLinker
          path: build/distributions/*.zip
          if-no-files-found: error

      - name: Upload Claude Sessions zip
        uses: actions/upload-artifact@v7
        with:
          name: ClaudeSessions
          path: ClaudeSessions/build/distributions/*.zip
          if-no-files-found: error
